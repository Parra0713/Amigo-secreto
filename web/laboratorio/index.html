<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de voz — El Plan del Amigo Secreto</title>
<link rel="stylesheet" href="/shared/estilos.css">
<style>
  main{max-width:860px;margin:0 auto;padding:var(--e4) var(--e3) var(--e6)}
  .paso{display:flex;gap:var(--e2);margin:var(--e3) 0}
  .paso div{flex:1;height:6px;border-radius:3px;background:var(--borde)}
  .paso div.hecho{background:var(--verde)} .paso div.activo{background:var(--oro)}
  .pregunta{font-size:var(--txt-grande);font-weight:700;line-height:1.2;margin:var(--e2) 0}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:var(--e3);margin:var(--e3) 0}
  .lado{text-align:center;padding:var(--e4) var(--e3);border:2px solid var(--borde);
        border-radius:var(--radio-grande);background:var(--fondo2)}
  .lado .letra{font-size:52px;font-weight:800;color:var(--oro);line-height:1}
  .lado.sonando{border-color:var(--oro);border-width:3px}
  .votos{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--e2)}
  .veredicto{border-left:5px solid var(--oro);padding-left:var(--e3);margin:var(--e3) 0}
  table{width:100%;border-collapse:collapse;font-size:var(--txt-secundario)}
  th,td{text-align:left;padding:var(--e2);border-bottom:1px solid var(--borde)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="degradado">
<main>
  <h1>Laboratorio de voz</h1>
  <p class="tenue">Cuatro pruebas, tres comparaciones cada una. Siempre a ciegas: se revela
  qué era cada cosa después de votar. Toma unos cinco minutos.</p>

  <div class="paso" id="progreso"></div>

  <div id="prueba">
    <div class="micro" id="etiquetaPrueba"></div>
    <div class="pregunta" id="preguntaPrueba"></div>
    <p class="tenue pie" id="notaPrueba"></p>

    <div class="par">
      <div class="lado" id="ladoA"><div class="letra">A</div>
        <button class="boton" data-oir="A">▶ Escuchar A</button></div>
      <div class="lado" id="ladoB"><div class="letra">B</div>
        <button class="boton" data-oir="B">▶ Escuchar B</button></div>
    </div>

    <div class="votos">
      <button class="boton" data-voto="A">Gana A</button>
      <button class="boton secundario" data-voto="empate" style="width:auto;padding-inline:var(--e4)">Iguales</button>
      <button class="boton" data-voto="B">Gana B</button>
    </div>
    <p id="revelacion" class="tenue" role="status" aria-live="polite" style="min-height:3em"></p>
  </div>

  <div id="final" class="oculto">
    <h2>Resultados</h2>
    <div id="veredictos"></div>
    <button class="boton" id="exportar">Copiar resultados</button>
    <button class="boton secundario" id="reiniciar">Empezar de nuevo</button>
  </div>

  <details style="margin-top:var(--e5)">
    <summary class="tenue">Escuchar todo sin ocultar nada</summary>
    <div id="directo"></div>
  </details>
</main>

<script type="module">
import { desbloquear, contexto, salida, ambienteEncender, ambienteApagar } from '/shared/audio.js';

const $ = (id) => document.getElementById(id);

/* Cada opción es un audio concreto más cómo se reproduce.
   'proceso' decide si pasa por la cadena de efectos del juego. */
const M = (archivo, extra = {}) => ({ archivo, proceso: 'crudo', personaje: 'grupier', sala: false, ...extra });

const PRUEBAS = [
  {
    id: 'procesamiento',
    etiqueta: 'Prueba 1 de 4',
    pregunta: '¿Cuál suena más a una persona?',
    nota: 'Misma voz y mismo texto. Lo único que cambia es si pasa por la cadena de efectos del grupier (graves, saturación, sala, voz-sombra, susurro).',
    repeticiones: 3,
    opciones: [
      { id: 'crudo', nombre: 'Sin efectos, la voz tal como sale del modelo', media: M('kokoro-em_santa-grupier') },
      { id: 'procesado', nombre: 'Con la cadena de efectos del grupier', media: M('kokoro-em_santa-grupier', { proceso: 'procesado' }) }
    ]
  },
  {
    id: 'texto',
    etiqueta: 'Prueba 2 de 4',
    pregunta: '¿Cuál suena menos a robot?',
    nota: 'Misma voz, sin efectos. Cambia solo cómo está escrita la frase: una fue escrita para leerse, la otra para decirse en voz alta.',
    repeticiones: 3,
    opciones: [
      { id: 'texto-ojo', nombre: 'Texto actual: "Alguien en esta sala está mintiendo. Las fichas no mienten, las personas sí."', media: M('kokoro-em_santa-grupier') },
      { id: 'texto-oido', nombre: 'Texto para el oído: "Alguien aquí está mintiendo… y no voy a decir quién. Porque las fichas no mienten. Las personas sí."', media: M('kokoro-em_santa-grupier-oido') }
    ]
  },
  {
    id: 'modelo',
    etiqueta: 'Prueba 3 de 4',
    pregunta: '¿Cuál voz prefieres para el grupier?',
    nota: 'Mismo texto (el bueno), sin efectos. Cambia solo el modelo. Si aquí empatas, no vale la pena bajar 350 MB.',
    repeticiones: 3,
    opciones: [
      { id: 'piper', nombre: 'Piper es_MX-claude-high (el que ya tienes)', media: M('piper-grupier-oido') },
      { id: 'kokoro', nombre: 'Kokoro em_santa (habría que descargarlo)', media: M('kokoro-em_santa-grupier-oido') }
    ]
  },
  {
    id: 'explicador',
    etiqueta: 'Prueba 4 de 4',
    pregunta: '¿Cuál entiendes mejor con la música encima?',
    nota: 'Ahora el explicador, con la música de fondo del juego sonando. Aquí no importa cuál suena más bonito, sino cuál se entiende sin esfuerzo.',
    repeticiones: 3,
    opciones: [
      { id: 'piper-exp', nombre: 'Piper, texto para el oído', media: M('piper-explicador-oido', { personaje: 'explicador', sala: true }) },
      { id: 'kokoro-exp', nombre: 'Kokoro em_santa, texto para el oído', media: M('kokoro-em_santa-explicador-oido', { personaje: 'explicador', sala: true }) }
    ]
  }
];

const CADENA = {
  grupier:    { velocidad: 0.87, graves: 5.5, pecho: 2.5, presencia: -2, sibilancia: -5, saturacion: 0.3, reverb: 0.3, preRetardo: 0.035, sombra: 0.13 },
  explicador: { velocidad: 1,    graves: 1,   pecho: 0,   presencia: 2,  sibilancia: -2, saturacion: 0,   reverb: 0.08, preRetardo: 0.012, sombra: 0 }
};

let iPrueba = 0, iRonda = 0, par = null, fuentes = [];
let votos = JSON.parse(localStorage.getItem('plan.lab.v2') || '[]');
const buffers = new Map();

async function cargar(archivo) {
  if (buffers.has(archivo)) return buffers.get(archivo);
  const ctx = desbloquear();
  const r = await fetch(`/laboratorio/muestras/${archivo}.wav`);
  const b = await ctx.decodeAudioData(await r.arrayBuffer());
  buffers.set(archivo, b);
  return b;
}

const curva = (cantidad) => {
  const n = 1024, c = new Float32Array(n), k = cantidad * 12;
  for (let i = 0; i < n; i++) { const x = (i * 2) / n - 1; c[i] = k === 0 ? x : Math.tanh(k * x) / Math.tanh(k); }
  return c;
};
function impulso(ctx) {
  const largo = Math.floor(ctx.sampleRate * 2);
  const b = ctx.createBuffer(2, largo, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < largo; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / largo, 3.4);
  }
  return b;
}

async function reproducir(opcion, lado) {
  const ctx = desbloquear();
  fuentes.forEach((f) => { try { f.stop(); } catch {} });
  fuentes = [];
  document.querySelectorAll('.lado').forEach((l) => l.classList.remove('sonando'));
  if (lado) $(`lado${lado}`).classList.add('sonando');

  const { archivo, proceso, personaje, sala } = opcion.media;
  const buffer = await cargar(archivo);
  const destino = salida();
  const fuente = ctx.createBufferSource();
  fuente.buffer = buffer;

  if (proceso === 'crudo') {
    fuente.connect(destino);
  } else {
    const a = CADENA[personaje];
    fuente.playbackRate.value = a.velocidad;
    const eq = (tipo, hz, gain, q) => {
      const f = ctx.createBiquadFilter();
      f.type = tipo; f.frequency.value = hz; f.gain.value = gain; if (q) f.Q.value = q;
      return f;
    };
    const sat = ctx.createWaveShaper(); sat.curve = curva(a.saturacion); sat.oversample = '2x';
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -22; comp.ratio.value = 3;
    const bus = fuente.connect(eq('lowshelf', 180, a.graves))
      .connect(eq('peaking', 420, a.pecho, 0.9))
      .connect(eq('peaking', 2500, a.presencia, 1))
      .connect(eq('peaking', 6500, a.sibilancia, 2))
      .connect(sat).connect(comp);
    const seco = ctx.createGain(); seco.gain.value = 1 - a.reverb * 0.45;
    bus.connect(seco).connect(destino);
    const pre = ctx.createDelay(0.2); pre.delayTime.value = a.preRetardo;
    const conv = ctx.createConvolver(); conv.buffer = impulso(ctx);
    const humedo = ctx.createGain(); humedo.gain.value = a.reverb;
    bus.connect(pre).connect(conv).connect(humedo).connect(destino);
    if (a.sombra > 0) {
      const sombra = ctx.createBufferSource();
      sombra.buffer = buffer; sombra.playbackRate.value = a.velocidad / 2;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
      const g = ctx.createGain(); g.gain.value = a.sombra;
      sombra.connect(lp).connect(g).connect(destino);
      sombra.start(); fuentes.push(sombra);
    }
  }
  if (sala) ambienteEncender(); else ambienteApagar();
  fuente.start();
  fuentes.push(fuente);
  fuente.onended = () => document.querySelectorAll('.lado').forEach((l) => l.classList.remove('sonando'));
}

function pintarProgreso() {
  $('progreso').innerHTML = PRUEBAS.map((p, i) =>
    `<div class="${i < iPrueba ? 'hecho' : i === iPrueba ? 'activo' : ''}"></div>`).join('');
}

function nuevaRonda() {
  if (iPrueba >= PRUEBAS.length) return terminar();
  const prueba = PRUEBAS[iPrueba];
  const [x, y] = Math.random() < 0.5 ? [0, 1] : [1, 0];
  par = { A: prueba.opciones[x], B: prueba.opciones[y] };

  $('etiquetaPrueba').textContent = `${prueba.etiqueta} · comparación ${iRonda + 1} de ${prueba.repeticiones}`;
  $('preguntaPrueba').textContent = prueba.pregunta;
  $('notaPrueba').textContent = prueba.nota;
  $('revelacion').textContent = '';
  document.querySelectorAll('[data-voto]').forEach((b) => { b.disabled = false; });
  pintarProgreso();
}

function votar(cual) {
  const prueba = PRUEBAS[iPrueba];
  const ganador = cual === 'empate' ? 'empate' : par[cual].id;
  const perdedor = cual === 'empate' ? 'empate' : par[cual === 'A' ? 'B' : 'A'].id;
  votos.push({ prueba: prueba.id, ganador, perdedor, ts: Date.now() });
  localStorage.setItem('plan.lab.v2', JSON.stringify(votos));

  $('revelacion').textContent = `A era: ${par.A.nombre}  ·  B era: ${par.B.nombre}`;
  document.querySelectorAll('[data-voto]').forEach((b) => { b.disabled = true; });
  ambienteApagar();

  iRonda++;
  if (iRonda >= prueba.repeticiones) { iPrueba++; iRonda = 0; }
  setTimeout(nuevaRonda, 2800);
}

function terminar() {
  $('prueba').classList.add('oculto');
  $('final').classList.remove('oculto');
  pintarProgreso();

  $('veredictos').innerHTML = PRUEBAS.map((prueba) => {
    const propios = votos.filter((v) => v.prueba === prueba.id);
    const conteo = {};
    for (const o of prueba.opciones) conteo[o.id] = 0;
    let empates = 0;
    for (const v of propios) v.ganador === 'empate' ? empates++ : conteo[v.ganador]++;

    const orden = Object.entries(conteo).sort((a, b) => b[1] - a[1]);
    const nombre = (id) => prueba.opciones.find((o) => o.id === id).nombre;
    const claro = orden[0][1] >= 2 && orden[0][1] > orden[1][1];
    const veredicto = empates > propios.length / 2
      ? 'Empate: no se distinguen. No vale la pena cambiar por esto.'
      : claro ? `Gana: ${nombre(orden[0][0])}`
              : 'Sin ganador claro. Hacen falta más comparaciones.';

    return `<div class="veredicto">
      <strong>${prueba.pregunta}</strong>
      <table><tbody>
        ${orden.map(([id, n]) => `<tr><td>${nombre(id)}</td><td class="num">${n}</td></tr>`).join('')}
        <tr><td class="tenue">Iguales</td><td class="num tenue">${empates}</td></tr>
      </tbody></table>
      <p class="${claro ? 'oro' : 'tenue'}">${veredicto}</p>
    </div>`;
  }).join('');
}

document.addEventListener('click', (e) => {
  const oir = e.target.dataset?.oir;
  const voto = e.target.dataset?.voto;
  if (oir && par) reproducir(par[oir], oir);
  if (voto && par) votar(voto);
});

$('exportar').onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(votos, null, 1));
  $('exportar').textContent = 'Copiado';
  setTimeout(() => { $('exportar').textContent = 'Copiar resultados'; }, 1500);
};
$('reiniciar').onclick = () => {
  votos = []; iPrueba = 0; iRonda = 0;
  localStorage.removeItem('plan.lab.v2');
  $('final').classList.add('oculto');
  $('prueba').classList.remove('oculto');
  nuevaRonda();
};

// Escucha libre, para cuando quieras comparar a mano
const TODAS = PRUEBAS.flatMap((p) => p.opciones.map((o) => ({ ...o, prueba: p.id })));
$('directo').innerHTML = TODAS.map((o, i) => `
  <div class="fila" style="margin:var(--e2) 0">
    <span class="crece pie">${o.nombre}</span>
    <button class="boton secundario" style="width:auto;margin:0" data-libre="${i}">▶</button>
  </div>`).join('');
$('directo').onclick = (e) => {
  const i = e.target.dataset?.libre;
  if (i !== undefined) reproducir(TODAS[Number(i)], null);
};

nuevaRonda();
</script></body></html>
